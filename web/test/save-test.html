<!doctype html>
<meta charset="utf-8">
<title>save.js tests</title>
<pre id="out">Running… (takes a few seconds)</pre>
<script type="module">
  import { createSaver } from "../save.js";

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const leavePrompted = () => {
    const ev = new Event("beforeunload", { cancelable: true });
    window.dispatchEvent(ev);
    return ev.defaultPrevented;
  };

  // Every test page load creates one saver; fake the server so nothing real is written.
  window.fetch = async () => new Response(JSON.stringify({ error: "conflict" }), { status: 409 });
  const statuses = [];
  const saver = createSaver({ getData: () => ({ version: 0, issues: [], wishlist: [] }), onStatus: (s) => statuses.push(s) });

  const failures = [];
  const check = (name, ok) => { if (!ok) failures.push(`FAIL ${name}`); };

  saver.changed();
  await wait(1300);
  check("conflict reported", statuses.includes("conflict"));
  check("edit that hit a conflict still prompts before leaving", leavePrompted());
  saver.changed();
  check("edits after a conflict still prompt before leaving", leavePrompted());

  document.getElementById("out").textContent = failures.length ? failures.join("\n") : "All 3 passed";
</script>
