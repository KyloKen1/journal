<!doctype html>
<meta charset="utf-8">
<title>suggest.js tests</title>
<pre id="out">Running…</pre>
<script type="module">
  import {
    acceptOption, createDismissQueue, dismissSuggestions, dismissTodoSuggestion, formatCheckedDate,
    initSuggestions, latestChecked, loadSuggestions, todoAcceptedQueue,
  } from "../suggest.js";

  // A fake suggestion store: update() applies the change to `file` and reports success.
  function fakeStore(file, { loadFails = false, updateOk = true } = {}) {
    return {
      async load() { if (loadFails) throw new Error("offline"); return structuredClone(file); },
      async update(mutate) { if (updateOk) mutate(file); return updateOk; },
    };
  }
  const sampleFile = () => ({
    items: { w1: { options: [] }, w2: { options: [] } },
    todos: { t1: { suggestions: [{ id: "g1", text: "Split it", steps: ["a"] }, { id: "g2", text: "Stalled", steps: [] }], dismissed: [] } },
  });

  const option = { name: "Kingston 16GB DDR4", price: 649, link: "https://x.co/r", shop: "Evetech", note: "" };
  const item = (notes = "") => ({ name: "RAM", price: null, link: "", notes, bought: false });
  const accepted = (it, opt = option) => { acceptOption(it, opt); return it; };

  const cases = [
    ["accept copies name/price/link and adds Was:", () => JSON.stringify(accepted(item())),
      JSON.stringify({ name: "Kingston 16GB DDR4", price: 649, link: "https://x.co/r", notes: "Was: RAM", bought: false })],
    ["accept keeps existing notes below Was:", () => accepted(item("for the work PC")).notes, "Was: RAM\nfor the work PC"],
    ["accept with the same name leaves notes alone", () => accepted(item("x"), { ...option, name: "RAM" }).notes, "x"],
    ["latestChecked picks the newest", () => latestChecked({ a: { checked: "2026-11-03T08:00:00" }, b: { checked: "2026-11-09T08:04:12" } }), "2026-11-09T08:04:12"],
    ["latestChecked of nothing is null", () => latestChecked({}), null],
    ['formatCheckedDate("2026-11-09T08:04:12")', () => formatCheckedDate("2026-11-09T08:04:12"), "Mon 9 Nov"],
    ['formatCheckedDate("2026-11-03T08:00:00")', () => formatCheckedDate("2026-11-03T08:00:00"), "Tue 3 Nov"],
  ];

  // Accepted suggestions are only cleared on the server after the journal has saved.
  const queueCases = [
    ["queue waits for flush before dismissing", async () => {
      const calls = [];
      const q = createDismissQueue(async (id) => { calls.push(id); return true; });
      q.add("a");
      const before = calls.length;
      await q.flush();
      return `${before} ${calls.join()} ${q.has("a")}`;
    }, "0 a false"],
    ["queue keeps ids whose dismiss failed", async () => {
      const q = createDismissQueue(async () => false);
      q.add("a");
      await q.flush();
      return q.has("a");
    }, true],
  ];
  for (const [name, run, expected] of queueCases) cases.push([name, run, expected]);

  // Everything below goes through the store set with initSuggestions().
  const storeCases = [
    ["loadSuggestions returns both sections", async () => {
      initSuggestions(fakeStore(sampleFile()));
      const s = await loadSuggestions();
      return `${Object.keys(s.items).join()} ${Object.keys(s.todos).join()}`;
    }, "w1,w2 t1"],
    ["loadSuggestions is empty when loading fails", async () => {
      initSuggestions(fakeStore(sampleFile(), { loadFails: true }));
      return JSON.stringify(await loadSuggestions());
    }, JSON.stringify({ items: {}, todos: {} })],
    ["dismissSuggestions removes that wishlist entry", async () => {
      const file = sampleFile();
      initSuggestions(fakeStore(file));
      const ok = await dismissSuggestions("w1");
      return `${ok} ${Object.keys(file.items).join()}`;
    }, "true w2"],
    ["dismissSuggestions reports a failed save", async () => {
      initSuggestions(fakeStore(sampleFile(), { updateOk: false }));
      return dismissSuggestions("w1");
    }, false],
    ["dismissTodoSuggestion removes it and records the text", async () => {
      const file = sampleFile();
      initSuggestions(fakeStore(file));
      const ok = await dismissTodoSuggestion("t1", "g2");
      return `${ok} ${file.todos.t1.suggestions.map((s) => s.id).join()} ${file.todos.t1.dismissed.join()}`;
    }, "true g1 Stalled"],
    ["dismissTodoSuggestion for an unknown todo does not throw", async () => {
      initSuggestions(fakeStore(sampleFile()));
      return dismissTodoSuggestion("gone", "g1");
    }, true],
    ["an accepted to-do suggestion is removed on flush, not recorded as dismissed", async () => {
      const file = sampleFile();
      initSuggestions(fakeStore(file));
      todoAcceptedQueue.add("t1/g1");
      const before = file.todos.t1.suggestions.length;
      await todoAcceptedQueue.flush();
      return `${before} ${file.todos.t1.suggestions.map((s) => s.id).join()} ${file.todos.t1.dismissed.length} ${todoAcceptedQueue.has("t1/g1")}`;
    }, "2 g2 0 false"],
  ];
  for (const c of storeCases) cases.push(c);

  const failures = [];
  for (const [name, run, expected] of cases) {
    let actual;
    try { actual = await run(); } catch (e) { actual = `threw ${e}`; }
    if (actual !== expected) failures.push(`FAIL ${name}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  document.getElementById("out").textContent =
    failures.length ? failures.join("\n") : `All ${cases.length} passed`;
</script>
