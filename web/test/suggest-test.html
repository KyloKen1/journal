<!doctype html>
<meta charset="utf-8">
<title>suggest.js tests</title>
<pre id="out">Running…</pre>
<script type="module">
  import { acceptOption, createDismissQueue, formatCheckedDate, latestChecked } from "../suggest.js";

  const option = { name: "Kingston 16GB DDR4", price: 649, link: "https://x.co/r", shop: "Evetech", note: "" };
  const item = (notes = "") => ({ name: "RAM", price: null, link: "", notes, bought: false });
  const accepted = (it, opt = option) => { acceptOption(it, opt); return it; };

  const cases = [
    ["accept copies name/price/link and adds Was:", () => JSON.stringify(accepted(item())),
      JSON.stringify({ name: "Kingston 16GB DDR4", price: 649, link: "https://x.co/r", notes: "Was: RAM", bought: false })],
    ["accept keeps existing notes below Was:", () => accepted(item("for the work PC")).notes, "Was: RAM\nfor the work PC"],
    ["accept with the same name leaves notes alone", () => accepted(item("x"), { ...option, name: "RAM" }).notes, "x"],
    ["latestChecked picks the newest", () => latestChecked({ a: { checked: "2026-11-03T08:00:00" }, b: { checked: "2026-11-09T08:04:12" } }), "2026-11-09T08:04:12"],
    ["latestChecked of nothing is null", () => latestChecked({}), null],
    ['formatCheckedDate("2026-11-09T08:04:12")', () => formatCheckedDate("2026-11-09T08:04:12"), "Mon 9 Nov"],
    ['formatCheckedDate("2026-11-03T08:00:00")', () => formatCheckedDate("2026-11-03T08:00:00"), "Tue 3 Nov"],
  ];

  // Accepted suggestions are only cleared on the server after the journal has saved.
  const queueCases = [
    ["queue waits for flush before dismissing", async () => {
      const calls = [];
      const q = createDismissQueue(async (id) => { calls.push(id); return true; });
      q.add("a");
      const before = calls.length;
      await q.flush();
      return `${before} ${calls.join()} ${q.has("a")}`;
    }, "0 a false"],
    ["queue keeps ids whose dismiss failed", async () => {
      const q = createDismissQueue(async () => false);
      q.add("a");
      await q.flush();
      return q.has("a");
    }, true],
  ];
  for (const [name, run, expected] of queueCases) cases.push([name, run, expected]);

  const failures = [];
  for (const [name, run, expected] of cases) {
    let actual;
    try { actual = await run(); } catch (e) { actual = `threw ${e}`; }
    if (actual !== expected) failures.push(`FAIL ${name}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  document.getElementById("out").textContent =
    failures.length ? failures.join("\n") : `All ${cases.length} passed`;
</script>
