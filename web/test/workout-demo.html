<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout demo (sample data, nothing is saved)</title>
<link rel="stylesheet" href="../style.css">
<body>
<header class="topbar">
  <h1>Journal</h1>
  <nav class="tabs">
    <button type="button">To-Do</button><button type="button">Work</button><button type="button">Wishlist</button>
    <button type="button">Books</button><button type="button" aria-selected="true">Workout</button>
  </nav>
  <span class="status">Demo — sample data, nothing is saved</span>
</header>
<main id="view" data-tab="workout"></main>
<script type="module">
  // The Workout tab on made-up data, for checking the layout by eye. Nothing leaves this page.
  import { renderWorkout } from "../workout.js";

  const s = (weight, ...reps) => reps.map((r) => ({ weight, reps: r }));
  const session = (id, date, workout, list) => ({ id, date, workout, notes: "", exercises: list.map(([key, sets]) => ({ key, sets })) });
  const state = {
    sessions: [
      session("1", "2026-11-09", "A", [["goblet-squat", s(16, 12, 12, 12)], ["db-bench", s(12, 10, 9, 8)], ["bb-row", s(30, 12, 11, 10)], ["kb-swing", s(16, 15, 15, 15)], ["plank", s(null, 40, 35, 30)]]),
      session("2", "2026-11-11", "B", [["bb-rdl", s(40, 10, 10, 9)], ["db-ohp", s(10, 9, 8, 8)], ["db-lunge", s(8, 10, 10, 10)], ["db-row", s(14, 12, 12, 11)], ["farmer-carry", s(20, 30, 30, 30)]]),
      session("3", "2026-11-13", "A", [["goblet-squat", s(20, 10, 9, 8)], ["db-bench", s(12, 11, 10, 9)], ["bb-row", s(30, 12, 12, 12)], ["kb-swing", s(16, 20, 20, 20)], ["plank", s(null, 45, 45, 40)]]),
    ],
  };
  window.demoState = state;
  renderWorkout(document.getElementById("view"), state, () => {});
</script>
</body>
</html>
